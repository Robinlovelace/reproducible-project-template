on:
  push:
    branches: [main]
  workflow_dispatch:

name: Quarto Publish

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Detect project requirements
        id: detect
        run: |
          NEED_R=false
          NEED_PYTHON=false
          NEED_TEX=false
          FORMATS=""
          ENGINES=""

          shopt -s globstar 2>/dev/null || true

          for f in *.qmd **/*.qmd; do
            [ -f "$f" ] || continue
            F=$(quarto inspect "$f" 2>/dev/null | jq -r '.formats // empty | keys[]' 2>/dev/null)
            FORMATS="$FORMATS $F"
            E=$(quarto inspect "$f" 2>/dev/null | jq -r '.engines // empty | .[]' 2>/dev/null)
            ENGINES="$ENGINES $E"
          done

          echo "Formats found: $FORMATS"
          echo "Engines found: $ENGINES"

          if echo "$ENGINES" | grep -qF "knitr"; then
            NEED_R=true
          fi
          if echo "$ENGINES" | grep -qF "jupyter"; then
            NEED_PYTHON=true
          elif echo "$ENGINES" | grep -qF "markdown"; then
            NEED_PYTHON=false
          fi
          if echo "$FORMATS" | grep -qF "pdf"; then
            NEED_TEX=true
          fi

          echo "need_r=$NEED_R" >> "$GITHUB_OUTPUT"
          echo "need_python=$NEED_PYTHON" >> "$GITHUB_OUTPUT"
          echo "need_tex=$NEED_TEX" >> "$GITHUB_OUTPUT"

      - name: Install TinyTeX
        if: steps.detect.outputs.need_tex == 'true'
        run: quarto install tinytex --no-prompt --update-path

      - name: Install R
        if: steps.detect.outputs.need_r == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install R dependencies
        if: steps.detect.outputs.need_r == 'true'
        run: |
          if [ -f renv.lock ]; then
            Rscript -e 'renv::restore()'
          else
            Rscript -e 'install.packages(c("sf", "tidyverse"))'
          fi

      - name: Set up Python
        if: steps.detect.outputs.need_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        if: steps.detect.outputs.need_python == 'true'
        run: |
          pip install -r requirements.txt 2>/dev/null || pip install pandas geopandas

      - name: Render site
        run: quarto render

      - name: Upload docx artifact
        if: hashFiles('docs/*.docx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: docx
          path: docs/*.docx

      - name: Upload pdf artifact
        if: hashFiles('docs/*.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: docs/*.pdf

      - name: Add .nojekyll
        run: touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
